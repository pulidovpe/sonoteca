name: Build Sonoteca (alfa)

on:
  push:
    tags:
      - 'v*'   # al subir un tag vX.Y.Z: compila todo en la nube y publica un release
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Plataforma a compilar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
      use_local_runners:
        description: 'Usar mis runners propios en lugar de los de GitHub'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Opcional: tag (ej. v0.9.2.3) para publicar en Releases lo que se compile'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  # Decide qué plataformas se compilan y en qué runner.
  # (Un `if:` a nivel de job no puede leer `matrix`, por eso la matriz se arma aquí.)
  plan:
    name: Plan de compilación
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: python
        env:
          TARGET: ${{ inputs.target_os }}
          LOCAL: ${{ inputs.use_local_runners }}
        run: |
          import json, os

          target = os.environ["TARGET"] or "all"  # con push de tag no hay inputs
          local = os.environ["LOCAL"] == "true"

          # Runners gratuitos de GitHub (repos públicos: uso ilimitado)
          cloud = {
              "linux": "ubuntu-latest",
              "windows": "windows-latest",
              "macos": "macos-latest",  # arm64 (M1)
          }
          # Runners propios: se eligen por ETIQUETAS, no por nombre.
          # self-hosted + SO + arquitectura se asignan solos al registrar el runner;
          # "sonoteca" es una etiqueta personalizada que tú añades al registrarlo.
          own = {
              "linux":   ["self-hosted", "Linux",   "X64",   "sonoteca"],
              "windows": ["self-hosted", "Windows", "X64",   "sonoteca"],
              "macos":   ["self-hosted", "macOS",   "ARM64", "sonoteca"],
          }
          names = {"linux": "Linux", "windows": "Windows", "macos": "macOS"}

          include = []
          for key in ("linux", "windows", "macos"):
              if target in ("all", key):
                  include.append({
                      "os_key": key,
                      "label": f"{names[key]} ({'local' if local else 'nube'})",
                      "runner": json.dumps(own[key] if local else cloud[key]),
                  })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")

  build:
    name: Build ${{ matrix.label }}
    needs: plan
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # checkout limpia el workspace (borra .venv-build, build/, dist/ de corridas previas),
      # importante en runners propios que reutilizan la carpeta.
      - name: Checkout
        uses: actions/checkout@v4

      # Linux compila dentro de Docker (Debian 12), no necesita Python en el host.
      # En runners propios no se usa setup-python: se espera Python 3.12 ya instalado
      # (en macOS setup-python puede pedir sudo, que el usuario dedicado no tiene).
      - name: Set up Python 3.12
        if: matrix.os_key != 'linux' && !contains(matrix.runner, 'self-hosted')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Los scripts de packaging/ son la única fuente de verdad del empaquetado:
      # crean .venv-build, instalan ".[ui,build]", corren PyInstaller con
      # packaging/sonoteca.spec, hacen la prueba de humo y check_bundle.py, y generan el zip/tar.gz.
      - name: Build (Linux, vía Docker)
        if: matrix.os_key == 'linux'
        shell: bash
        run: |
          chmod +x packaging/*.sh
          ./packaging/build_linux_docker.sh

      - name: Build (macOS)
        if: matrix.os_key == 'macos'
        shell: bash
        env:
          PYTHON: python3.12
        run: |
          chmod +x packaging/*.sh
          ./packaging/build_mac.sh

      - name: Build (Windows)
        if: matrix.os_key == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\packaging\build_win.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonoteca-${{ matrix.os_key }}
          path: |
            dist/Sonoteca-*.zip
            dist/Sonoteca-*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os_key }}
          path: |
            build.log
            build/pruned.txt
          if-no-files-found: ignore
          retention-days: 7

  # Corre al subir un tag v* o al lanzar a mano con release_tag. Publica lo que haya
  # compilado bien (si una plataforma falla, el release sale sin ella).
  # Si el release ya existe, añade los archivos nuevos: así puedes lanzar macOS y
  # Windows en ejecuciones separadas con el mismo release_tag y quedan juntos.
  # Con un tag siempre se usan runners de la nube (nunca tus equipos).
  release:
    name: Publicar release
    needs: build
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'failure') &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Solo se baja CHANGELOG.md, no el repo entero.
      - name: Checkout (solo CHANGELOG.md)
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          pattern: sonoteca-*
          path: release_files
          merge-multiple: true

      - name: Preparar notas desde CHANGELOG.md
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          tag = os.environ["TAG"]
          ver = tag.lstrip("vV")
          repo = os.environ["REPO"]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              print("::error::No se encontró CHANGELOG.md en la raíz del repo")
              sys.exit(1)

          pat = re.compile(r"(?<![\w.])v?" + re.escape(ver) + r"(?![\w]|\.\d)")
          heads = list(re.finditer(r"^##[ \t]+.*$", text, re.M))
          anchor = None
          for i, h in enumerate(heads):
              if pat.search(h.group(0)):
                  heading_text = h.group(0).lstrip("#").strip()
                  # Generar el slug estándar de GitHub para los anchors (minúsculas, sin espacios extra, sin símbolos especiales)
                  slug = heading_text.lower()
                  slug = re.sub(r"[^\w\- ]+", "", slug)
                  slug = slug.replace(" ", "-")
                  anchor = slug
                  break

          if anchor:
              notes = f"Consulta los cambios de esta versión en el [Changelog](https://github.com/{repo}/blob/main/CHANGELOG.md#{anchor})."
          else:
              print(f"::warning::No se encontró la sección para {ver} en CHANGELOG.md; se usa el enlace general")
              notes = f"Consulta los cambios de esta versión en el [Changelog](https://github.com/{repo}/blob/main/CHANGELOG.md)."

          open("release_notes.md", "w", encoding="utf-8").write(notes + "\n")
          print(notes)
          PY

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -lh release_files
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release_notes.md
          else
            gh release create "$TAG" release_files/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sonoteca $TAG" \
              --notes-file release_notes.md \
              --prerelease
          fi