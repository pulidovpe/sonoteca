name: CI Tests

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths-ignore:
      - 'android/**'      # el trabajo de la app Android no dispara la CI de Python
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '**.md'
  workflow_call:          # para que build.yml pueda exigirla antes de compilar
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit a probar (vacío = el seleccionado arriba). Ej.: v1.0.0'
        required: false
        default: ''
        type: string

# Sin secretos, solo lectura: es seguro con PRs de terceros (se usa pull_request, NO pull_request_target).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  QT_QUICK_CONTROLS_STYLE: Basic
  PYTHONUTF8: '1'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests

  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Las letras tienen copyright y las bases son datos personales: no deben versionarse.
      - name: Sin letras ni bases de datos versionadas
        run: |
          FOUND="$(git ls-files '*.lrc' '*.db' '*.db-wal' '*.sqlite')"
          if [ -n "$FOUND" ]; then
            echo "::error::Hay letras o bases de datos versionadas:"
            echo "$FOUND"
            exit 1
          fi

  test:
    name: Pruebas (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # ffmpeg: los tests generan audio/video reales (sin él se OMITEN en silencio).
      # Resto: librerías que Qt necesita aunque la plataforma sea «offscreen».
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0

      # Mismas versiones de PySide6 que el empaquetado (packaging/build-constraints.txt).
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          if [ -f packaging/build-constraints.txt ]; then C="-c packaging/build-constraints.txt"; else C=""; fi
          pip install $C -e ".[ui,dev]"

      - name: Versiones
        run: |
          python --version
          ffmpeg -version | head -1
          pip list 2>/dev/null | grep -i -E "pyside6|shiboken|pytest|mutagen|cryptography|httpx"

      # Sin `| tee` sobre pytest: tee devolvería 0 aunque fallen. Se guarda el código y se decide después.
      - name: pytest
        id: pytest
        run: |
          set +e
          pytest -q -rfEs -p no:cacheprovider > pytest.log 2>&1
          RC=$?
          tail -n 80 pytest.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      # Falla solo si hay fallos que no están en .github/known-failures.txt.
      - name: Comparar con fallos conocidos
        run: python .github/scripts/check_baseline.py pytest.log "${{ steps.pytest.outputs.rc }}" .github/known-failures.txt

      - name: Subir log de pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 7
