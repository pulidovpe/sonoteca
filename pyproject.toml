[project]
name = "musicapp"
version = "0.1.0"
description = "Reproductor y organizador de música local (clon tipo Spotify, solo local)"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.6"]
# Se añadirá en fases posteriores: watchdog

[project.scripts]
musicapp = "musicapp.cli:main"

[project.gui-scripts]
musicapp-gui = "musicapp.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
