[project]
name = "musicapp"
dynamic = ["version"]   # sale de src/musicapp/__init__.py (una sola fuente)
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo" }]
description = "Reproductor y organizador de música local (clon tipo Spotify, solo local)"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]
# Se añadirá en fases posteriores: watchdog

[project.scripts]
musicapp = "musicapp.cli:main"

[project.gui-scripts]
musicapp-gui = "musicapp.ui.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/musicapp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/musicapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packaging"]
